  bx(s,W/2-50,65,100,30,c,"Kafka","event stream");
  bx(s,W-95,20,90,40,"#22c55e","BigQuery","sink");
  ln(s,95,65,W/2-50,35,c,true);ln(s,W/2+50,35,W/2+50,65,c);ln(s,W/2+50,80,W-95,40,"#22c55e");
  let oi=0;
  const t=setInterval(()=>{
    const op=ops[oi%4];
    lR.forEach((r,i)=>gsap.to(r,{attr:{fill:i===oi%4?ops[i].c+"33":ops[i].c+"12"},duration:.2}));
    const p=pk(s,95,35+(oi%4)*23,op.c);glow(p,op.c);
    gsap.to(p,{attr:{cx:W/2-50,cy:35},duration:.45,onComplete:()=>{p.setAttribute("fill",c);
      gsap.to(p,{attr:{cy:80},duration:.3,onComplete:()=>{gsap.to(p,{attr:{cx:W-95,cy:40},duration:.35,onComplete:()=>{gsap.to(p,{opacity:0,duration:.2,onComplete:()=>p.remove()})}})}})}});
    oi++;
  },850);
  addTimer(id,t);
}

// ── COLUMNAR ──
function simColumnar(wrap,c,id){
  const{s,W}=makeSVG(wrap);
  const hw=Math.floor((W-20)/2);
  // Row storage side
  tx(s,"Row Storage",hw/2+5,12,"#94a3b8",7.5,{w:"700"});
  const rowData=[["id","name","salary","dept"],["1","John","5000","Eng"],["2","Jane","6000","HR"],["3","Bob","5500","Eng"]];
  rowData.forEach((row,ri)=>{
    row.forEach((cell,ci)=>{
      const cw2=hw/4;
      const r=sn("rect",{x:5+ci*cw2,y:16+ri*18,width:cw2-2,height:16,rx:2,fill:ri===0?c+"1a":c+"0a",stroke:c+"22","stroke-width":"1"},s);
      tx(s,cell,5+ci*cw2+cw2/2,26+ri*18,ri===0?c+"99":c+"66",7);
    });
  });
  // Columnar side
  tx(s,"Columnar Storage",hw+hw/2+15,12,"#22c55e",7.5,{w:"700"});
  const cols=[["salary"],["5000"],["6000"],["5500"]];
  const colR=cols.map((col,i)=>{
    const r=sn("rect",{x:hw+15+(i*(hw/4)),y:22,width:hw/4-3,height:70,rx:3,fill:i===0?c+"18":c+"0a",stroke:i===0?"#22c55e55":c+"22","stroke-width":"1"},s);
    col.forEach((v,j)=>tx(s,v,hw+15+(i*(hw/4))+(hw/4-3)/2,22+j*18+13,i===0?"#22c55ecc":c+"77",7));
    return r;
  });
  const qL=tx(s,"SELECT SUM(salary)...",W/2,108,c+"66",7.5);
  const stL=tx(s,"",W/2,120,c+"55",7);
  let phase=0;
  const t=setInterval(()=>{
    if(phase===0){qL.textContent="SELECT SUM(salary) FROM employees";
      stL.textContent="Row storage: must read ALL columns even though we only need salary";
      rowData.slice(1).forEach((_,ri)=>{
        for(let ci=0;ci<4;ci++){gsap.to(s.querySelectorAll("rect")[1+ci+ri*4]||s,{attr:{fill:c+"22"},duration:.2,delay:ci*.1})}
      });
    }else if(phase===1){
      stL.textContent="Columnar: read ONLY salary column — skip id, name, dept entirely!";
      colR.forEach((r,i)=>gsap.to(r,{attr:{fill:i===0?"#22c55e33":c+"0a"},duration:.3}));
    }else{
      s.querySelectorAll("rect").forEach(r=>gsap.to(r,{attr:{fill:c+"0a"},duration:.2}));colR.forEach(r=>gsap.to(r,{attr:{fill:c+"0a"},duration:.2}));
      phase=-1;
    }
    phase++;
  },1200);
  addTimer(id,t);
}

// ── BASE ──
function simBase(wrap,c,id){
  const{s,W}=makeSVG(wrap);
  bx(s,5,28,85,64,c,"Primary","Write OK");
  bx(s,W/2-45,6,90,36,"#22c55e","Replica 1","(async)");
  bx(s,W/2-45,68,90,36,c,"Replica 2","(async)");
  bx(s,W-90,28,85,64,c,"Replica 3","(async)");
  const v1=tx(s,"v=1",W/2,28,c+"77",7);const v2=tx(s,"v=1",W/2,90,c+"77",7);const v3=tx(s,"v=1",W-47,58,c+"77",7);
  const stL=tx(s,"",W/2,116,"#fbbf24",7.5);
  let ver=1;
  const t=setInterval(()=>{
    ver++;
    tx(s,`v=${ver}`,45,58,c+"cc",8,{w:"700"});
    stL.textContent=`Write v=${ver} → ACK immediately, replicas sync in background`;
    const p1=pk(s,90,45,c,4);gsap.to(p1,{attr:{cx:W/2-45,cy:24},duration:.5,delay:.1,onComplete:()=>{v1.textContent=`v=${ver}`;v1.setAttribute("fill","#22c55e");p1.remove()}});
    const p2=pk(s,90,65,c,4);gsap.to(p2,{attr:{cx:W/2-45,cy:86},duration:.65,delay:.2,onComplete:()=>{v2.textContent=`v=${ver}`;p2.remove()}});
    const p3=pk(s,90,55,c,4);gsap.to(p3,{attr:{cx:W-90,cy:60},duration:.55,delay:.3,onComplete:()=>{v3.textContent=`v=${ver}`;p3.remove()}});
  },1300);
  addTimer(id,t);
}

// ── VACUUM ──
function simVacuum(wrap,c,id){
  const{s,W}=makeSVG(wrap);
  const rows=Array.from({length:8},(_,i)=>({y:8+i*13,dead:i===2||i===4||i===6}));
  const rects=rows.map(r=>{
    const rect=sn("rect",{x:5,y:r.y,width:W/2-20,height:11,rx:2,fill:r.dead?"#ef444420":"#22c55e14",stroke:r.dead?"#ef444440":"#22c55e33","stroke-width":"1"},s);
    tx(s,r.dead?"💀 DEAD TUPLE":"✓ Live row",W/4,r.y+8.5,r.dead?"#ef444488":"#22c55e77",6.5);
    return rect;
  });
  tx(s,"← Table Storage",W/4,116,c+"55",7.5);
  const vBox=bx(s,W/2+10,8,W/2-15,56,c,"VACUUM","running...");
  const stL=tx(s,"",3*W/4,75,c+"77",8);
  const spaceL=tx(s,"",3*W/4,92,c+"55",7.5);
  const deadL=tx(s,`Dead tuples: ${rows.filter(r=>r.dead).length}`,3*W/4,108,c+"66",7.5);
  let phase=0,deadCount=3;
  const t=setInterval(()=>{
    if(phase===0){stL.textContent="VACUUM triggered (autovacuum)";spaceL.textContent="Finding dead tuples...";
    }else if(phase<=3){
      const di=[2,4,6][phase-1];
      gsap.to(rects[di],{attr:{fill:"#fbbf2422",stroke:"#fbbf2444"},duration:.3});
      stL.textContent=`Removing dead tuple at row ${di+1}`;
    }else if(phase===4){
      rows.filter(r=>r.dead).forEach((_,i)=>{gsap.to(rects[[2,4,6][i]],{attr:{fill:c+"0a",stroke:c+"22"},duration:.5})});
      deadCount=0;deadL.textContent="Dead tuples: 0";stL.textContent="✅ Dead tuples removed — space reclaimed!";spaceL.textContent="Table size reduced, query faster";
    }else{
      rows.forEach((r,i)=>gsap.to(rects[i],{attr:{fill:r.dead?"#ef444420":"#22c55e14",stroke:r.dead?"#ef444440":"#22c55e33"},duration:.3}));
      deadCount=3;deadL.textContent=`Dead tuples: ${deadCount}`;stL.textContent="New UPDATEs created dead tuples again...";phase=-1;
    }
    phase++;
  },1000);
  addTimer(id,t);
}

// ── GENERIC fallback ──
function simGeneric(wrap,c,id,label){
  const{s,W}=makeSVG(wrap);
  bx(s,5,35,78,50,c,"Input","data");
  bx(s,W/2-55,12,110,96,c,label||"Process","concept");
  bx(s,W-83,35,78,50,c,"Output","result");
  ln(s,83,60,W/2-55,60,c);ln(s,W/2+55,60,W-83,60,c);
  let pi=0;
  const t=setInterval(()=>{
    const p=pk(s,83,60,c);glow(p,c);
    gsap.to(p,{attr:{cx:W/2-55},duration:.4,ease:"power2.inOut",onComplete:()=>{
      gsap.to(p,{attr:{cx:W-83},duration:.35,onComplete:()=>{gsap.to(p,{opacity:0,duration:.2,onComplete:()=>p.remove()})}});
    }});
    pi++;
  },800);
  addTimer(id,t);
}

// ── DISPATCH ──
const SIM_MAP={
  medallion:simMedallion,acid:simAcid,cap:simCap,stream:simStream,dag:simDag,
  mvcc:simMvcc,deadlock:simDeadlock,sharding:simSharding,replication:simReplication,
  rbac:simRbac,btree:simBtree,dq:simDq,caching:simCaching,star:simStar,
  partitioning:simPartitioning,scd:simScd,twopc:simTwopc,connpool:simConnpool,
  wal:simWal,idempotency:simIdempotency,elt:simElt,etl:simEtl,
  foreignkey:simForeignkey,unique:simUnique,cdc:simCdc,columnar:simColumnar,
  base:simBase,vacuum:simVacuum,
  // aliases
  lakehouse:simElt,lambda:simDag,fabric:simStream,dwlake:simElt,batch:simStream,
  mqueue:simStream,schemrw:simScd,rowcol:simColumnar,iceberg:simScd,
  clustering:simPartitioning,compaction:simVacuum,tiering:simCaching,
  storagetypes:simConnpool,snowflake:simStar,datavault:simScd,semantic:simElt,
  facttypes:simStar,catalog:simDq,lineage:simDag,mdm:simIdempotency,
  classification:simRbac,steward:simDq,mv:simCaching,queryopt:simBtree,
  bloom:simBtree,cbo:simBtree,masking:simRbac,encryption:simUnique,
  audit:simDag,tokenization:simUnique,featurestore:simConnpool,schemareg:simUnique,
  observability:simDq,vectordb:simBtree,llmpipeline:simElt,
  pacelc:simCap,ryw:simMvcc,eventual:simReplication,isolation:simMvcc,
  normalization:simScd,primarykey:simUnique,cardinality:simBtree,
  surrogatekey:simUnique,null:simDq,savepoint:simAcid,locks:simDeadlock,
  bloat:simVacuum,sequence:simUnique,uuid:simUnique,viewmv:simCaching,
  trigger:simScd,storedproc:simEtl,cte:simStream,window:simBtree,
  upsert:simIdempotency,explainplan:simBtree,schema_ns:simConnpool,orm:simElt,
  lateral:simStar,recursive:simDag,pgpartition:simPartitioning,json:simDq,
  fts:simBtree,connstring:simConnpool,computed:simScd,bqpartition:simPartitioning,
  explainopt:simBtree,rowvscol:simColumnar,mesh:simDag,htap:simReplication,
};

function runSim(term,wrap){
  const fn=SIM_MAP[term.sim];
  if(fn)fn(wrap,term.color,term.id);
  else simGeneric(wrap,term.color,term.id,term.term);
}

// ═══════════════════════════════════════════
// GAMIFICATION
// ═══════════════════════════════════════════
let xp=0,seen=new Set(),allExp=false,activeCat="All",searchQ="";

function addXP(amount){
  xp+=amount;
  document.getElementById("xp").textContent=`${xp} XP`;
  const lvl=Math.floor(xp/500)+1;
  if(xp%500<amount){showToast(`🎉 Level ${lvl} unlocked!`);}
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  gsap.to(t,{opacity:1,y:0,duration:.35,ease:"power2.out",onComplete:()=>{
    gsap.to(t,{opacity:0,y:-16,duration:.35,delay:2});
  }});
}
function markSeen(id){
  if(seen.has(id))return;
  seen.add(id);
  addXP(10);
  document.getElementById("sc").textContent=seen.size;
  const pct=(seen.size/101)*100;
  document.getElementById("pb").style.width=pct+"%";
  const card=document.getElementById(`card-${id}`);
  if(card)card.classList.add("seen");
  if(seen.size===10)showToast("🔥 10 concepts learned!");
  if(seen.size===50)showToast("⚡ Halfway there — 50 concepts!");
  if(seen.size===101)showToast("🏆 MASTER: All 101 concepts learned!");
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
const CATS=["All",...[...new Set(T.map(t=>t.cat))]];

function getFiltered(){
  return T.filter(t=>(activeCat==="All"||t.cat===activeCat)&&
    (!searchQ||t.term.toLowerCase().includes(searchQ)||t.konsep.toLowerCase().includes(searchQ)||t.tools.some(x=>x.toLowerCase().includes(searchQ))));
}

function renderCats(){
  const counts={};CATS.slice(1).forEach(c=>counts[c]=T.filter(t=>t.cat===c).length);
  document.getElementById("cats").innerHTML=CATS.map(cat=>`
    <button class="cp${cat===activeCat?" on":""}" onclick="setCat('${cat}')">${cat}${cat!=="All"?` (${counts[cat]})`:` (${T.length})`}</button>`).join("");
}

function renderStats(){
  const cm={};T.forEach(t=>cm[t.cat]=t.color);
  document.getElementById("sbar").innerHTML=[...new Set(T.map(t=>t.cat))].map(cat=>`
    <div class="sc"><div class="sdot" style="background:${cm[cat]}"></div><span style="color:var(--mt)">${cat}</span><span class="snum" style="color:${cm[cat]}">${T.filter(t=>t.cat===cat).length}</span></div>`).join("");
}

const expandedIds=new Set();

function startFlow(id,proses){
  if(FT[id])clearInterval(FT[id]);
  const steps=proses.split("→").length;let active=0;
  function tick(){
    const c=document.getElementById(`flow-${id}`);if(!c){clearInterval(FT[id]);return;}
    c.querySelectorAll(".fs").forEach((el,i)=>el.classList.toggle("a",i===active));
    c.querySelectorAll(".fa").forEach((el,i)=>el.classList.toggle("a",i<active));
    active=(active+1)%steps;
  }
  tick();FT[id]=setInterval(tick,700);
}
function stopFlow(id){clearInterval(FT[id]);delete FT[id];const c=document.getElementById(`flow-${id}`);if(c)c.querySelectorAll(".fs,.fa").forEach(el=>el.classList.remove("a"));}

function buildFlow(proses,id){
  return proses.split("→").map((s,i,arr)=>`<span class="fs">${s.trim()}</span>${i<arr.length-1?'<span class="fa">›</span>':""}`).join("");
}

function renderCards(){
  const filtered=getFiltered();
  document.getElementById("rc").innerHTML=`Menampilkan <strong>${filtered.length}</strong> dari ${T.length} term`;
  const el=document.getElementById("cards");
  const emp=document.getElementById("empty");
  if(!filtered.length){el.innerHTML="";emp.style.display="block";return;}
  emp.style.display="none";
  el.innerHTML=filtered.map(t=>{
    const isOpen=allExp||expandedIds.has(t.id);
    return `<div class="card${isOpen?" open":""}${seen.has(t.id)?" seen":""}" id="card-${t.id}" style="--cc:${t.color}">
  <div class="chdr" onclick="toggleCard(${t.id})">
    <div class="cnum">${t.id}</div>
    <div class="cico"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="${t.icon}"/></svg></div>
    <div class="ctitle">${t.term}</div>
    <div class="ccat">${t.cat}</div>
    <div class="cunlk">✓ learned</div>
    <div class="cchev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><polyline points="6 9 12 15 18 9"/></svg></div>
  </div>
  <div class="cbody">
    <div class="cbi">
      <div class="illus" id="illus-${t.id}"></div>
      <div class="dgrid">
        <div class="db"><div class="dbl">💡 Konsep</div><div class="dbt">${t.konsep}</div></div>
        <div class="db"><div class="dbl">📐 Metodologi</div><div class="dbt">${t.met}</div></div>
        <div class="db"><div class="dbl">🔄 Alur Proses</div><div class="flow" id="flow-${t.id}">${buildFlow(t.proses,t.id)}</div></div>
        <div class="db"><div class="dbl">🏢 Contoh</div><div class="dbt">${t.contoh}</div></div>
      </div>
      <div class="trow">
        <span style="font-size:9px;color:${t.color};font-weight:700;margin-right:4px">🛠️ Tools:</span>
        ${t.tools.map(tool=>`<span class="tbg">${tool}</span>`).join("")}
      </div>
    </div>
  </div>
</div>`;
  }).join("");

  gsap.fromTo(".card",{opacity:0,y:10},{opacity:1,y:0,duration:.3,stagger:.025,ease:"power2.out"});

  filtered.forEach(t=>{if(allExp||expandedIds.has(t.id))initCard(t);});
}

function initCard(t){
  const wrap=document.getElementById(`illus-${t.id}`);
  if(wrap&&!wrap._init){wrap._init=true;setTimeout(()=>runSim(t,wrap),50);}
  startFlow(t.id,t.proses);
}

function toggleCard(id){
  const card=document.getElementById(`card-${id}`);
  const t=T.find(x=>x.id===id);
  if(!card||!t)return;
  if(expandedIds.has(id)){
    expandedIds.delete(id);card.classList.remove("open");stopFlow(id);cleanup(id);
  }else{
    expandedIds.add(id);card.classList.add("open");markSeen(id);
    setTimeout(()=>{initCard(t);card.scrollIntoView({behavior:"smooth",block:"nearest"});},50);
  }
}

function setCat(cat){
  activeCat=cat;expandedIds.clear();
  Object.keys(FT).forEach(id=>stopFlow(id));
  document.querySelectorAll(".illus").forEach(w=>{cleanup(parseInt(w.id.split("-")[1]));w._init=false;w.innerHTML="";});
  renderCats();renderCards();
}

document.getElementById("search").addEventListener("input",function(){
  searchQ=this.value.toLowerCase().trim();
  expandedIds.clear();Object.keys(FT).forEach(id=>stopFlow(id));renderCards();
});

document.getElementById("btnexp").addEventListener("click",function(){
  allExp=!allExp;this.textContent=allExp?"Collapse All":"Expand All";this.classList.toggle("on",allExp);
  if(!allExp){expandedIds.clear();Object.keys(FT).forEach(id=>stopFlow(id));}
  else{getFiltered().forEach(t=>setTimeout(()=>initCard(t),50));}
  renderCards();
});

gsap.from(".hi > *",{opacity:0,y:16,duration:.6,stagger:.1,ease:"power3.out"});
renderStats();renderCats();renderCards();
</script>
