<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Data Engineering 101</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--bg:#060910;--sf:#0c1420;--bd:rgba(255,255,255,.06);--tx:#e2e8f0;--mt:#475569}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Inter',-apple-system,sans-serif;overflow-x:hidden}
.hero{position:relative;padding:44px 20px 30px;border-bottom:1px solid var(--bd);overflow:hidden}
.hbg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 5% 50%,rgba(99,102,241,.2) 0%,transparent 55%),radial-gradient(ellipse 60% 80% at 95% 40%,rgba(168,85,247,.16) 0%,transparent 55%),linear-gradient(170deg,#0b0f1a,#060910)}
.hgr{position:absolute;inset:0;background-image:linear-gradient(rgba(99,102,241,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.04) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(ellipse 90% 100% at 50% 0%,black 30%,transparent 100%)}
.hi{position:relative;max-width:1040px;margin:0 auto}
.hbadge{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hdot{width:7px;height:7px;border-radius:50%;background:#6366f1;box-shadow:0 0 14px #6366f1;animation:pd 2.5s ease-in-out infinite}
@keyframes pd{0%,100%{box-shadow:0 0 8px #6366f1}50%{box-shadow:0 0 24px #6366f1,0 0 48px rgba(99,102,241,.4)}}
.hlbl{font-size:10px;color:#6366f1;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.hero h1{font-size:clamp(22px,3.5vw,36px);font-weight:800;line-height:1.2;margin-bottom:8px}
.grad{background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hsub{color:var(--mt);font-size:13px;margin-bottom:14px}
.pstrip{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pbadge{display:flex;align-items:center;gap:6px;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.25);border-radius:20px;padding:5px 14px;font-size:11px;color:#a5b4fc;font-weight:600}
.pbarw{flex:1;min-width:160px;height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.pbar{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:4px;transition:width .6s ease;width:0%}
.xpb{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);border-radius:20px;padding:4px 12px;font-size:11px;color:#fbbf24;font-weight:700}
.main{max-width:1040px;margin:0 auto;padding:20px 14px 80px}
.ctrl{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap}
.sw{flex:1;min-width:200px;position:relative}
.sw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mt);pointer-events:none}
.si{width:100%;padding:9px 13px 9px 34px;background:var(--sf);border:1px solid var(--bd);border-radius:9px;color:var(--tx);font-size:12px;outline:none;transition:border-color .2s}
.si:focus{border-color:rgba(99,102,241,.5)}
.bexp{padding:9px 16px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--mt);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.bexp.on{background:rgba(99,102,241,.2);border-color:#6366f1;color:#a5b4fc}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cp{padding:4px 11px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--mt);font-size:10px;font-weight:700;cursor:pointer;transition:all .2s}
.cp:hover{border-color:rgba(255,255,255,.12);color:#94a3b8}
.cp.on{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.5);color:#a5b4fc}
.sbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sc{display:flex;align-items:center;gap:4px;padding:4px 9px;background:var(--sf);border-radius:6px;border:1px solid var(--bd);font-size:9px}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.snum{font-weight:700;font-size:10px}
.rc{font-size:11px;color:var(--mt);margin-bottom:10px}
.rc strong{color:#94a3b8}
.cards{display:flex;flex-direction:column;gap:6px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:border-color .3s,box-shadow .3s;position:relative}
.card.open{border-color:var(--cc);box-shadow:0 4px 30px color-mix(in srgb,var(--cc) 12%,transparent)}
.card.seen::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cc);border-radius:2px 0 0 2px}
.chdr{display:flex;align-items:center;gap:9px;padding:10px 13px;cursor:pointer;user-select:none;transition:background .15s}
.chdr:hover{background:rgba(255,255,255,.015)}
.cnum{font-size:9px;color:var(--mt);font-weight:700;min-width:22px;text-align:right}
.cico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid color-mix(in srgb,var(--cc) 40%,transparent);background:color-mix(in srgb,var(--cc) 10%,transparent)}
.cico svg{width:13px;height:13px;stroke:var(--cc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctitle{font-weight:700;font-size:12px;flex:1;color:var(--cc)}
.ccat{font-size:8px;font-weight:700;padding:2px 7px;border-radius:7px;border:1px solid color-mix(in srgb,var(--cc) 35%,transparent);background:color-mix(in srgb,var(--cc) 8%,transparent);color:var(--cc);white-space:nowrap}
.cunlk{display:none;font-size:9px;color:#22c55e;font-weight:700;align-items:center;gap:2px;white-space:nowrap}
.card.seen .cunlk{display:flex}
.cchev{color:var(--mt);flex-shrink:0;transition:transform .3s}
.card.open .cchev{transform:rotate(180deg)}
.cbody{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
.card.open .cbody{max-height:14000px}
.cbi{padding:0 13px 13px}
.illus{width:100%;border-radius:9px;margin-bottom:11px;background:rgba(0,0,0,.45);border:1px solid var(--bd);overflow:hidden;height:120px;position:relative}
.illus svg{position:absolute;inset:0;width:100%;height:100%}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
@media(max-width:540px){.dgrid{grid-template-columns:1fr}}
.db{background:rgba(0,0,0,.32);border-radius:7px;padding:9px 11px;border:1px solid var(--bd)}
.dbl{font-size:9px;font-weight:700;margin-bottom:4px;color:var(--cc);display:flex;align-items:center;gap:3px}
.dbt{font-size:11px;color:#94a3b8;line-height:1.65}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin-top:3px}
.fs{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:600;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:#334155;transition:all .25s}
.fs.a{color:#fff;border-color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,transparent);box-shadow:0 0 7px color-mix(in srgb,var(--cc) 30%,transparent)}
.fa{color:#1e293b;font-size:10px;transition:color .2s}
.fa.a{color:var(--cc)}
.trow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tbg{font-size:9px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid color-mix(in srgb,var(--cc) 20%,transparent);color:#64748b}
.empty{text-align:center;padding:50px 0;color:var(--mt)}
.toast{position:fixed;top:16px;right:16px;background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid #6366f1;border-radius:12px;padding:12px 18px;color:#fff;font-weight:700;font-size:13px;z-index:1000;pointer-events:none;opacity:0;transform:translateY(-16px)}
</style>
</head>
<body>
<div class="hero">
  <div class="hbg"></div><div class="hgr"></div>
  <div class="hi">
    <div class="hbadge"><div class="hdot"></div><span class="hlbl">Data Engineering 101</span></div>
    <h1>Architecture, Engineering &<br><span class="grad">Database Fundamentals</span></h1>
    <p class="hsub">101 konsep · Animasi simulasi interaktif · Gamified learning</p>
    <div class="pstrip">
      <div class="pbadge">📚 <span id="sc">0</span> / 101 dipelajari</div>
      <div class="pbarw"><div class="pbar" id="pb"></div></div>
      <div class="xpb" id="xp">0 XP</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="main">
  <div class="ctrl">
    <div class="sw">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="si" id="search" placeholder="Cari 101 term, konsep, tools..." autocomplete="off"/>
    </div>
    <button class="bexp" id="btnexp">Expand All</button>
  </div>
  <div class="cats" id="cats"></div>
  <div class="sbar" id="sbar"></div>

</div>
<script>
// ═══════════════════════════════════════════
// TERM DATA — 101 terms
// ═══════════════════════════════════════════
const T=[
// ARSITEKTUR
{id:1,cat:"Arsitektur",color:"#818cf8",term:"Medallion Architecture",icon:"M12 3L2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 18l10 5 10-5",
konsep:"Tiga layer kualitas data: Bronze (raw as-is), Silver (cleaned & validated), Gold (aggregated mart). Tiap layer tambah kualitas.",
met:"Bronze: ingest apa adanya. Silver: deduplicate, validate, normalize. Gold: aggregate, join, bentuk mart untuk BI & ML.",
proses:"Source → Bronze (raw) → Silver (clean/validate) → Gold (mart) → BI / ML",
contoh:"Klaim AHM: Bronze=raw PDF/JSON, Silver=parsed & validated, Gold=fact_klaim + dim tables untuk dashboard.",
tools:["Databricks","Delta Lake","Apache Iceberg","dbt","BigQuery"],sim:"medallion"},
{id:2,cat:"Arsitektur",color:"#6366f1",term:"Data Lakehouse",icon:"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z",
konsep:"Gabungan Data Lake (storage murah, format bebas) + Data Warehouse (structured, query-ready). Satu platform analitik & ML.",
met:"Raw data di object storage, terapkan ACID + schema via Iceberg/Delta. Query langsung tanpa copy ke DWH terpisah.",
proses:"Ingest → Object Storage → Iceberg Layer → Query Engine → BI / ML",
contoh:"AHM simpan raw klaim PDF di GCS, Iceberg layer di atasnya untuk analitik BigQuery tanpa ETL terpisah.",
tools:["Databricks","Apache Iceberg","Delta Lake","BigQuery","Snowflake"],sim:"lakehouse"},
{id:3,cat:"Arsitektur",color:"#8b5cf6",term:"Lambda Architecture",icon:"M22 12h-4l-3 9L9 3l-3 9H2",
konsep:"Batch Layer (akurat, lambat) + Speed Layer (cepat, approximate) berjalan paralel. Digabung di Serving Layer.",
met:"Batch reprocess histori periodik untuk akurasi. Speed layer handle real-time dengan data terbaru. Serving merge keduanya.",
proses:"Source → Batch Layer (Spark) + Speed Layer (Flink) → Serving Layer → Query",
contoh:"Telemetri kendaraan Astra: Flink alert real-time overheat, Spark batch laporan efisiensi harian.",
tools:["Apache Spark","Apache Flink","Kafka","Hadoop","BigQuery"],sim:"lambda"},
{id:4,cat:"Arsitektur",color:"#a855f7",term:"Kappa Architecture",icon:"M22 12h-4l-3 9L9 3l-3 9H2",
konsep:"Satu stream processing layer saja. Semua data diperlakukan sebagai stream — reprocessing via replay event log.",
met:"Retain events di Kafka jangka panjang. Reprocessing = replay dari offset awal dengan consumer baru.",
proses:"Event Log (Kafka long-retention) → Stream Processor → Serving Store → Query",
contoh:"Astra Digital: semua transaksi sebagai Kafka event, Flink process untuk fraud detection & billing.",
tools:["Apache Kafka","Apache Flink","Google Pub/Sub","Dataflow"],sim:"stream"},
{id:5,cat:"Arsitektur",color:"#ec4899",term:"Data Mesh",icon:"M12 2L2 7l10 5 10-5-10-5M2 17l10 5 10-5M2 12l10 5 10-5",
konsep:"Desentralisasi ownership: tiap domain bisnis punya data product sendiri. Kebalikan satu tim data central yang bottleneck.",
met:"4 prinsip: Domain ownership, Data as a product, Self-serve platform, Federated governance.",
proses:"Domain Team → Build Data Product → Publish to Catalog → Consumer Domain",
contoh:"AHM, ACC, Astra Digital punya domain data sendiri — publish ke shared Dataplex Catalog Astra Group.",
tools:["Dataplex","Collibra","DataHub","Apache Atlas","dbt"],sim:"mesh"},
{id:6,cat:"Arsitektur",color:"#f43f5e",term:"Data Fabric",icon:"M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z",
konsep:"Intelligence layer berbasis AI/metadata yang menghubungkan data dari berbagai sumber otomatis. Bukan arsitektur fisik.",
met:"AI/ML untuk auto-discovery metadata, lineage otomatis, rekomendasi akses. Knowledge graph sebagai fondasi.",
proses:"Multi-Source → Metadata Crawl → Knowledge Graph → AI Recommendation → Unified Access",
contoh:"Microsoft Purview di Astra untuk unified catalog lintas GCP dan Azure tanpa pindah data.",
tools:["Microsoft Purview","Google Dataplex","Informatica","Talend"],sim:"fabric"},
{id:7,cat:"Arsitektur",color:"#06b6d4",term:"HTAP",icon:"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 0 3-3h7z",
konsep:"Hybrid Transactional/Analytical Processing. Satu DB engine handle OLTP (write) dan OLAP (analitik) sekaligus tanpa ETL.",
met:"Row store untuk write (OLTP), columnar store untuk read (OLAP) di satu engine. Real-time analytics on live operational data.",
proses:"Transactional Write → Row Store (OLTP) + async sync → Column Store (OLAP) → Real-time Analytics",
contoh:"TiDB di Astra: insert transaksi penjualan real-time sekaligus query laporan agregat tanpa delay ETL.",
tools:["TiDB","SingleStore","SAP HANA","Google AlloyDB","CockroachDB"],sim:"htap"},
{id:8,cat:"Arsitektur",color:"#14b8a6",term:"Data Warehouse vs Data Lake",icon:"M21 5c0 1.66-4 3-9 3S3 6.66 3 5m18 0c0-1.66-4-3-9-3S3 3.34 3 5m18 0v14c0 1.66-4 3-9 3s-9-1.34-9-3V5",
konsep:"DWH: structured, schema-on-write, SQL, akurat tapi rigid. Data Lake: format bebas, schema-on-read, semua data, fleksibel tapi perlu governance.",
met:"DWH: ETL → defined schema → load. Lake: ingest dulu → schema defined saat query. Lake lebih fleksibel, DWH lebih reliable.",
proses:"DWH: ETL → Schema → Load → Query | Lake: Ingest Raw → Schema-on-read → Query",
contoh:"BigQuery DWH untuk laporan keuangan Astra. GCS Data Lake untuk raw data semua sumber sebelum diproses.",
tools:["BigQuery (DWH)","Snowflake (DWH)","GCS (Lake)","S3 (Lake)","ADLS (Lake)"],sim:"dwlake"},
// PIPELINE
{id:9,cat:"Pipeline",color:"#22d3ee",term:"ETL — Extract Transform Load",icon:"M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
konsep:"Classic pattern: Extract dari source, Transform (clean/enrich/reshape) di staging, LALU Load ke target. Transform sebelum load.",
met:"Transform di ETL engine/staging server, bukan di target DB. Lebih kontrol tapi butuh compute tersendiri.",
proses:"Source → Extract → Staging Transform (clean/join/agg) → Validate → Load to DWH",
contoh:"SSIS/Talend extract data HR AHM, transform di server staging, load ke SQL Server DWH tiap malam.",
tools:["Apache Spark","SSIS","Talend","Informatica","Pentaho"],sim:"etl"},
{id:10,cat:"Pipeline",color:"#0ea5e9",term:"ELT — Extract Load Transform",icon:"M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
konsep:"Modern approach: Load raw dulu ke cloud DWH, transform di dalam DWH menggunakan compute-nya. Raw selalu tersimpan.",
met:"Manfaatkan compute BigQuery/Snowflake. Raw selalu ada sebagai fallback. Transform via dbt — versioned, testable SQL.",
proses:"Source → Extract → Load Raw to DWH → Transform in-DWH (dbt) → Mart → Analytics",
contoh:"Fivetran extract MySQL klaim AHM → load raw BigQuery → dbt transform staging→intermediate→mart.",
tools:["dbt","Fivetran","Airbyte","BigQuery","Snowflake"],sim:"elt"},
{id:11,cat:"Pipeline",color:"#06b6d4",term:"CDC — Change Data Capture",icon:"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z",
konsep:"Tangkap perubahan DB (INSERT/UPDATE/DELETE) real-time dari transaction log — bukan full table scan yang mahal.",
met:"Baca binlog MySQL / WAL PostgreSQL. Setiap change jadi event ke downstream. Zero performance impact ke source DB.",
proses:"DB Transaction → Write Binlog/WAL → CDC reads log → Event to Kafka → Sink to Target",
contoh:"Debezium baca binlog MySQL klaim AHM → Kafka → GCP Datastream → BigQuery, sync real-time.",
tools:["Debezium","GCP Datastream","Striim","Fivetran","Kafka Connect"],sim:"cdc"},
{id:12,cat:"Pipeline",color:"#14b8a6",term:"Stream Processing",icon:"M22 12h-4l-3 9L9 3l-3 9H2",
konsep:"Pemrosesan data real-time saat mengalir — bukan kumpulkan dulu, proses nanti. Low latency, continuous computation.",
met:"Windowing: tumbling (fixed), sliding (overlap), session (activity). Watermark untuk late data. Stateful/stateless ops.",
proses:"Event Source → Message Queue → Window → Aggregate/Join/Filter → Emit → Sink",
contoh:"GPS kendaraan → Pub/Sub → Dataflow → alert real-time jika keluar geofence atau kecepatan anomali.",
tools:["Apache Flink","Google Dataflow","Spark Streaming","Kafka Streams","Bytewax"],sim:"stream"},
{id:13,cat:"Pipeline",color:"#10b981",term:"Batch Processing",icon:"M2 7h20M2 12h20M2 17h20",
konsep:"Kumpulkan data dalam periode tertentu (harian/jam-an), proses sekaligus satu job besar. Akurat tapi ada latency.",
met:"Trigger by schedule atau data size. Spark/Hive proses seluruh dataset. Efisien untuk large volume tapi bukan real-time.",
proses:"Accumulate Data (hour/day) → Schedule Trigger → Spark Job reads all → Transform → Write Output",
contoh:"Laporan klaim AHM: Spark job jalan tiap jam 01.00, proses semua transaksi hari itu, load ke mart.",
tools:["Apache Spark","Apache Hive","Hadoop MapReduce","Dataproc","AWS Glue"],sim:"batch"},
{id:14,cat:"Pipeline",color:"#84cc16",term:"Orchestration — DAG",icon:"M12 22V12M12 12L4 7M12 12l8-5",
konsep:"Manajemen dependency, scheduling, retry, alerting antar task pipeline. DAG = Directed Acyclic Graph.",
met:"DAG: node=task, edge=dependency. Handle retry logic, SLA alerting, backfill histori, cross-pipeline dependency.",
proses:"Schedule Trigger → Parse DAG → Task A → Task B (waits A) → C (waits A+B) → Success/Alert",
contoh:"Cloud Composer orchestrate: ingest PDF → LLM extract → DQ check → load BQ → notify Slack.",
tools:["Apache Airflow","Cloud Composer","Prefect","Dagster","Mage.ai"],sim:"dag"},
{id:15,cat:"Pipeline",color:"#f59e0b",term:"Message Queue & Event Streaming",icon:"M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6",
konsep:"Sistem async untuk kirim/terima event antar service. Kafka: high-throughput log, replay-able. RabbitMQ: routing-based.",
met:"Producer → topic/queue. Consumer baca independen. Kafka retain event (replay). RabbitMQ ACK-based (consumed=gone).",
proses:"Producer → Publish to Topic → Broker stores → Consumer Group reads → Process → ACK",
contoh:"Pub/Sub di Astra Digital: payment events dipublish, multiple consumer (fraud, notif, analytics) baca paralel.",
tools:["Apache Kafka","Google Pub/Sub","RabbitMQ","AWS SQS","Azure Service Bus"],sim:"mqueue"},
{id:16,cat:"Pipeline",color:"#fb923c",term:"Reverse ETL",icon:"M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
konsep:"Data dari DWH → kembali ke operational tools (CRM, Ads, Support). Aktivasi data analitik ke dalam alur bisnis.",
met:"Sync segment/metric dari DWH ke downstream SaaS. Operationalize analytics supaya sales/marketing pakai data DWH.",
proses:"DWH → Define Sync Model → Reverse ETL → CRM / Ads / Support Tool → Action",
contoh:"Churn risk score tinggi di BigQuery → Hightouch → Salesforce, sales team AHM direct outreach.",
tools:["Hightouch","Census","Polytomic","Grouparoo","Omnata"],sim:"stream"},
{id:17,cat:"Pipeline",color:"#e879f9",term:"Schema-on-Read vs Schema-on-Write",icon:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6",
konsep:"SoW (DWH): schema didefinisikan SEBELUM data masuk — reject jika tidak sesuai. SoR (Lake): schema diterapkan SAAT query.",
met:"SoW: data quality tinggi, rigid. SoR: accept semua format, flexible. Trade-off quality vs flexibility.",
proses:"SoW: Define Schema → Validate on ingest → Reject mismatch | SoR: Accept all → Apply schema at query",
contoh:"BigQuery (SoW): tabel klaim harus sesuai schema. GCS Parquet (SoR): bisa query field baru tanpa alter table.",
tools:["BigQuery (SoW)","Snowflake (SoW)","Parquet on GCS (SoR)","Hive (SoR)","Iceberg (hybrid)"],sim:"schemrw"},
// STORAGE
{id:18,cat:"Storage & Format",color:"#f59e0b",term:"Columnar Storage",icon:"M3 3h18M3 9h18M3 15h18",
konsep:"Data disimpan per kolom, bukan per baris. Query analitik hanya butuh beberapa kolom — skip kolom lain. Kompresi jauh lebih baik.",
met:"Nilai sejenis di satu kolom → kompresi tinggi (RLE, dictionary). Predicate pushdown: filter di storage level.",
proses:"Write: Row → Transpose → Compress per Column → Store | Read: SELECT cols → Decompress only target cols",
contoh:"Parquet klaim 50 kolom — SELECT claim_amount hanya baca 1 kolom, hemat 98% I/O vs row storage.",
tools:["Apache Parquet","Apache ORC","BigQuery","Snowflake","DuckDB"],sim:"columnar"},
{id:19,cat:"Storage & Format",color:"#a78bfa",term:"Row Storage vs Columnar",icon:"M3 3h18v4H3zM3 10h18v4H3zM3 17h18v4H3z",
konsep:"Row: simpan satu baris penuh berdampingan — optimal OLTP (insert/update satu record). Columnar: optimal OLAP (scan jutaan baris).",
met:"Row: fast single-row lookup. Columnar: fast aggregation. OLTP=row, OLAP=columnar.",
proses:"OLTP Write: INSERT → Row heap (full row together) | OLAP Read: SELECT agg → Column scan (target cols only)",
contoh:"MySQL (row) untuk input klaim oleh petugas. BigQuery (columnar) untuk laporan agregat ribuan klaim.",
tools:["MySQL/PostgreSQL (row)","InnoDB","BigQuery (col)","Parquet","Cassandra (row)"],sim:"rowcol"},
{id:20,cat:"Storage & Format",color:"#f97316",term:"Open Table Format — Iceberg/Delta/Hudi",icon:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8",
konsep:"Standar open-source tabel analitik di data lake: ACID transactions, schema evolution, time travel, concurrent access.",
met:"Metadata layer di atas object storage. Snapshot history, file manifests. Tiap write = snapshot baru (atomic commit).",
proses:"Write → New Snapshot → Update Manifest → Atomic Commit | Read → Latest Snapshot → Resolve Files",
contoh:"Iceberg di GCS tabel histori klaim AHM — time travel ke snapshot 6 bulan lalu untuk audit OJK.",
tools:["Apache Iceberg","Delta Lake","Apache Hudi","BigLake","Nessie Catalog"],sim:"iceberg"},
{id:21,cat:"Storage & Format",color:"#ef4444",term:"Partitioning — Date, Range, List, Hash",icon:"M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z",
konsep:"Bagi tabel ke segmen fisik berdasarkan kolom. Date: by month/day. Range: value range. List: explicit values. Hash: distribusi merata.",
met:"Query optimizer skip partisi irrelevan (partition pruning). Date paling umum di DWH. Hash untuk distribusi merata tanpa natural key.",
proses:"INSERT → Determine partition key → Route to partition | Query → Check WHERE → Prune irrelevant → Scan matching only",
contoh:"BigQuery tabel klaim: PARTITION BY DATE(tanggal_klaim) — query WHERE bulan=Jan hanya scan 1/12 data.",
tools:["BigQuery","Snowflake","PostgreSQL","Apache Iceberg","MySQL"],sim:"partitioning"},
{id:22,cat:"Storage & Format",color:"#f43f5e",term:"Clustering & Sorting",icon:"M18 20V10M12 20V4M6 20v-6",
konsep:"Sort data dalam partisi berdasarkan kolom tertentu untuk percepat filter. BigQuery: CLUSTER BY. Snowflake: micro-partition sorting.",
met:"Clustering co-locate rows dengan nilai kolom yang sama. Query filter by cluster key → skip banyak blocks.",
proses:"Write → Sort by cluster key within partition → Store co-located blocks | Query → Prune blocks by cluster key stats",
contoh:"BigQuery: CLUSTER BY kode_cabang. Query cabang tertentu skip 95% blocks dalam partisi hari itu.",
tools:["BigQuery","Snowflake","Apache Iceberg","DuckDB","Redshift"],sim:"clustering"},
{id:23,cat:"Storage & Format",color:"#fb923c",term:"Compaction & Vacuum",icon:"M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
konsep:"Compaction: merge ribuan small files jadi file optimal. Vacuum: hapus versi data lama setelah retention window.",
met:"Streaming writes buat many small files. Compaction merge → 128MB-1GB optimal. Vacuum reclaim storage, remove dead rows.",
proses:"Monitor file sizes → Compaction: merge small → write optimal → update manifest | Vacuum: expire old snapshots",
contoh:"Iceberg klaim: 30 hari streaming → 10K small files → compaction → 50 optimal. Vacuum hapus snapshot > 7 hari.",
tools:["Apache Iceberg","Delta Lake OPTIMIZE+VACUUM","PostgreSQL VACUUM","Spark","Hudi"],sim:"compaction"},
{id:24,cat:"Storage & Format",color:"#22d3ee",term:"Data Tiering — Hot, Warm, Cold",icon:"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
konsep:"Simpan data di storage tier berbeda berdasarkan frekuensi akses. Hot (SSD, mahal) → Warm (HDD) → Cold (archive, murah).",
met:"Lifecycle policy otomatis pindahkan data berdasarkan usia/akses. Hot: BigQuery active. Warm: GCS Standard. Cold: GCS Archive.",
proses:"Data created → Hot storage → Aged → Move to Warm → Aged more → Move to Cold archive",
contoh:"Klaim 0-30 hari: BigQuery hot. 30-365 hari: GCS Standard. >1 tahun: GCS Archive (lebih murah 90%).",
tools:["GCS Lifecycle","AWS S3 Intelligent-Tiering","Azure Blob Tiers","BigQuery Long-term"],sim:"tiering"},
{id:25,cat:"Storage & Format",color:"#4ade80",term:"Object vs Block vs File Storage",icon:"M2 2h8v8H2zM14 2h8v8h-8zM2 14h8v8H2zM14 14h8v8h-8z",
konsep:"Object: flat namespace, unlimited scale (GCS/S3) — untuk data lake. Block: raw blocks untuk DB. File: POSIX filesystem (NFS).",
met:"Object: no random write, tapi unlimited scale. Block: low latency random I/O untuk DB. File: shared access legacy apps.",
proses:"Object: PUT/GET by key (HTTP) | Block: sector-level read/write (kernel driver) | File: open/read/write by path (POSIX)",
contoh:"GCS (object) untuk data lake. Persistent Disk (block) untuk PostgreSQL. Filestore (file) untuk legacy app NFS.",
tools:["GCS (object)","AWS S3","Persistent Disk (block)","Cloud Filestore (file)","Azure Blob"],sim:"storagetypes"},
// MODELING
{id:26,cat:"Modeling",color:"#3b82f6",term:"Star Schema",icon:"M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z",
konsep:"Fact Table (metrics) di tengah, dikelilingi Dimension Tables (atribut). Paling umum di DWH. Simple, BI-friendly, query cepat.",
met:"Dimension denormalized (no JOIN chain). Fact table: FKs + numeric measures. Define grain (1 baris = 1 apa?). Kimball.",
proses:"Define grain → Choose facts → Choose dims → Build fact table → Connect dims with FK",
contoh:"fact_klaim(jumlah, tanggal_sk, pasien_sk, cabang_sk) + dim_pasien + dim_tanggal + dim_cabang.",
tools:["BigQuery","dbt","Looker","Power BI","Tableau"],sim:"star"},
{id:27,cat:"Modeling",color:"#1d4ed8",term:"Snowflake Schema",icon:"M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z",
konsep:"Seperti Star Schema tapi dimension tables di-normalize lebih lanjut. Sub-dimension mengurangi redundansi tapi perlu lebih JOIN.",
met:"dim_kota di-normalize dari dim_pasien. Hemat storage, tapi query lebih lambat karena extra JOIN chain.",
proses:"Star Schema → Normalize Dimensions → Create sub-dimension tables → FK from dim to sub-dim",
contoh:"dim_pasien → dim_kota → dim_provinsi. Lebih normalized tapi query JOIN chain lebih panjang dari Star.",
tools:["BigQuery","PostgreSQL","dbt","Snowflake","SQL Server"],sim:"snowflake"},
{id:28,cat:"Modeling",color:"#6366f1",term:"Data Vault 2.0",icon:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
konsep:"Hub (entity/business key) + Link (relationship) + Satellite (attributes + history). Insert-only. Full audit trail.",
met:"Hub: business keys only. Link: many-to-many relations. Satellite: descriptive attrs + load_date. Semua INSERT.",
proses:"Source → Hub (BK only) → Link (relationships) → Satellite (attrs + load_date) → Business Vault",
contoh:"Hub_Pasien(NIK) → Link_Klaim(NIK + claim_id) → Sat_Pasien(nama, alamat, load_date). Setiap perubahan → row baru.",
tools:["dbt","datavault4dbt","WhereScape","BigQuery","Snowflake"],sim:"datavault"},
{id:29,cat:"Modeling",color:"#8b5cf6",term:"SCD — Slowly Changing Dimension",icon:"M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 6v6l4 2",
konsep:"Handle perubahan atribut dimension. Type 1: overwrite. Type 2: row baru + history. Type 3: tambah kolom prev_value.",
met:"Type 2 paling umum: tambah row baru dengan effective_date, expiry_date, is_current. Preserve full history.",
proses:"Detect change → Type 2: SET old row is_current=false → INSERT new row (is_current=true, effective=today)",
contoh:"dim_pasien: alamat pindah → row lama expire, row baru diinsert. Laporan JOIN ke alamat yang benar waktu itu.",
tools:["dbt Snapshots","Apache Spark","BigQuery MERGE","Dataflow","Informatica"],sim:"scd"},
{id:30,cat:"Modeling",color:"#a855f7",term:"Semantic Layer",icon:"M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z",
konsep:"Abstraction layer antara data fisik dan user bisnis. Definisikan metric & business logic SEKALI — konsisten di semua BI tools.",
met:"Single source of truth: 'Revenue' = SUM(amount) WHERE status=settled — definisi sekali, dipakai Looker/Excel/Python.",
proses:"Raw Data → dbt Transform → Semantic Layer (metric defs) → Any BI Tool / API → Consistent results",
contoh:"dbt Semantic Layer: definisi klaim_valid sekali → dashboard Looker, Power BI, dan Jupyter — sama semua.",
tools:["dbt Semantic Layer","Cube.js","LookML","AtScale","Metriql"],sim:"semantic"},
{id:31,cat:"Modeling",color:"#c084fc",term:"Fact Table Types",icon:"M12 2l7 4v8l-7 4-7-4V6z",
konsep:"4 tipe: Transaction (per event), Periodic Snapshot (snapshot periodik), Accumulating Snapshot (milestones), Factless (kehadiran).",
met:"Transaction: paling umum. Snapshot: balance per hari. Accumulating: pipeline claim dengan timestamp tiap stage.",
proses:"Transaction: per event → INSERT | Snapshot: end of period → INSERT all state | Accumulating: → UPDATE milestones",
contoh:"fact_klaim (transaction). fact_saldo_harian (periodic). fact_proses_klaim (accumulating: submitted→verified→paid).",
tools:["BigQuery","dbt","Snowflake","Power BI","Tableau"],sim:"facttypes"},
// GOVERNANCE
{id:32,cat:"Governance",color:"#0ea5e9",term:"Data Catalog",icon:"M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z",
konsep:"Metadata repository terpusat: apa itu data, dari mana, siapa yang pakai, artinya apa secara bisnis. Data discovery engine.",
met:"Auto-crawl metadata. Classify & tag (PII, sensitivity). Business glossary. Search & discovery. Kolaborasi anotasi.",
proses:"Crawl Sources → Extract Metadata → Business Enrichment → Tag/Classify → Publish → Search → Discovery",
contoh:"Dataplex Catalog Astra: semua tabel BQ terdokumentasi — owner, PII tags, freshness, business definition.",
tools:["Google Dataplex","Apache Atlas","Collibra","DataHub","Alation"],sim:"catalog"},
{id:33,cat:"Governance",color:"#06b6d4",term:"Data Lineage",icon:"M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3",
konsep:"Track perjalanan data end-to-end: source → transformasi → destination. Column-level lineage untuk impact analysis & debug.",
met:"Auto via SQL parsing atau OpenLineage instrumentation. Build dependency graph. Impact: jika source berubah, apa terpengaruh?",
proses:"Parse SQL/Pipeline → Extract column mappings → Build Lineage DAG → Store → Visualize → Impact query",
contoh:"Kolom total_klaim di mart — trace ke raw PDF melalui 3 layer dbt. Debug data issue 10x lebih cepat.",
tools:["OpenLineage","dbt Lineage","Google Dataplex","Marquez","Monte Carlo"],sim:"lineage"},
{id:34,cat:"Governance",color:"#14b8a6",term:"Data Quality (DQ)",icon:"M20 6L9 17l-5-5",
konsep:"Validasi otomatis: completeness, accuracy, consistency, timeliness, uniqueness. DQ as Code — tidak ada manual check.",
met:"Define expectations as code → Run setelah setiap load → Pass: proceed | Fail: quarantine + alert + block downstream.",
proses:"Data arrives → Run DQ rules → Pass: next layer | Fail: quarantine + alert",
contoh:"Great Expectations cek klaim AHM: null check NIK, jumlah > 0, format tanggal ISO, no duplicate claim_id.",
tools:["Great Expectations","dbt Tests","Soda Core","Monte Carlo","Lightup"],sim:"dq"},
{id:35,cat:"Governance",color:"#22c55e",term:"Master Data Management (MDM)",icon:"M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z",
konsep:"Satu sumber kebenaran untuk entitas master (customer, product, vendor). Eliminasi duplikasi dan inkonsistensi lintas sistem.",
met:"Entity resolution & matching, deduplication, golden record creation, distribution ke semua systems.",
proses:"Multi-source → Entity matching & dedup → Create golden record → Distribute to all downstream systems",
contoh:"Satu definisi 'customer' Astra Group dengan NIK sebagai master key — dipakai AHM, ACC, Astra Life konsisten.",
tools:["Informatica MDM","Reltio","Semarchy","Stibo Systems","Talend MDM"],sim:"mdm"},
{id:36,cat:"Governance",color:"#84cc16",term:"Data Classification",icon:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
konsep:"Kategorisasi data: Public, Internal, Confidential, Restricted. Menentukan siapa boleh akses dan bagaimana data dilindungi.",
met:"Auto-classify via DLP (scan content, detect PII). Manual tagging oleh Data Steward. Policy enforcement by classification.",
proses:"Ingest Data → DLP Scan → Detect PII/PHI → Auto-tag → Apply access policies → Audit trail",
contoh:"NIK → Restricted. Nama → Confidential. Jumlah klaim aggregate → Internal. Public dashboard → Public.",
tools:["Google DLP","Microsoft Purview","AWS Macie","BigQuery Policy Tags","Collibra"],sim:"classification"},
{id:37,cat:"Governance",color:"#fb923c",term:"Data Stewardship",icon:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
konsep:"Peran/tanggung jawab manusia dalam menjaga kualitas dan definisi data di suatu domain. Bukan tools, tapi orang & proses.",
met:"Steward: define business glossary, approve metadata, resolve DQ issues, set access policies untuk domainnya.",
proses:"Steward assigned → Define business terms → Curate metadata → Monitor DQ → Resolve issues → Certify data",
contoh:"Finance Data Steward AHM bertanggung jawab atas definisi 'net_revenue', approve akses ke tabel keuangan.",
tools:["Collibra","Atlan","DataHub","Alation","Microsoft Purview"],sim:"steward"},
// PERFORMA
{id:38,cat:"Performa",color:"#f59e0b",term:"Materialized View",icon:"M2 3h20v14H2zM8 21h8M12 17v4",
konsep:"View yang hasilnya di-precompute dan disimpan fisik — tidak dihitung ulang tiap query. Trade-off: storage vs query speed.",
met:"Refresh incremental (delta only) atau full rebuild. Query optimizer auto-route ke MV jika cocok (transparan ke user).",
proses:"Define MV → Initial build → Schedule incremental refresh → Query hits MV → Return pre-computed result",
contoh:"BigQuery MV: agregasi harian klaim per cabang — auto-refresh tiap jam, dashboard instant vs 10 detik.",
tools:["BigQuery Materialized View","Snowflake Dynamic Tables","PostgreSQL MV","dbt incremental"],sim:"mv"},
{id:39,cat:"Performa",color:"#f97316",term:"Query Optimization & EXPLAIN",icon:"M13 2L3 14h9l-1 8 10-12h-9z",
konsep:"Buat query efisien: partition pruning, predicate pushdown, column pruning, join order, index. EXPLAIN ANALYZE untuk diagnosa.",
met:"EXPLAIN plan: Seq Scan → tambah index. Full partition scan → tambah WHERE filter. Nested loop large N → Hash Join.",
proses:"Write Query → EXPLAIN ANALYZE → Identify bottleneck → Optimize → Measure → Iterate",
contoh:"BigQuery: tambah WHERE date >= '2024-01' → hemat 95% bytes. JOIN ke small lookup table dulu.",
tools:["BigQuery Query Plan","Snowflake Query Profile","EXPLAIN ANALYZE","DBeaver","pgMustard"],sim:"queryopt"},
{id:40,cat:"Performa",color:"#ef4444",term:"Caching — Redis, BI Engine, CDN",icon:"M2 2h20v8H2zM2 14h20v8H2zM6 6h.01M6 18h.01",
konsep:"Simpan hasil komputasi di storage lebih cepat. Cache hit = tidak perlu compute ulang. L1/L2/Redis/CDN hierarchy.",
met:"Cache-aside: check cache → miss → fetch DB → store. Write-through: tulis ke cache + DB sekaligus. TTL-based expiry.",
proses:"Request → Check Cache → HIT: return cached | MISS: query DB → Store in cache → Return → Next req hits cache",
contoh:"Redis cache hasil query dashboard BigQuery. TTL 5 menit → 1000 user lihat dashboard, DB hanya di-query 1x/5mnt.",
tools:["Redis","Memcached","BigQuery BI Engine","CloudFlare CDN","Varnish"],sim:"caching"},
{id:41,cat:"Performa",color:"#22d3ee",term:"Bloom Filter",icon:"M21 21l-4.35-4.35M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z",
konsep:"Probabilistic data structure: cek apakah element MUNGKIN ada atau PASTI tidak ada. False positive possible, false negative TIDAK.",
met:"k hash functions → set bits in bit array. Lookup: any 0 = definitely NOT in set. All 1 = PROBABLY in set.",
proses:"INSERT: hash k times → set k bits. LOOKUP: hash k times → any bit=0: NOT PRESENT | all 1: PROBABLY PRESENT",
contoh:"Parquet bloom filter: sebelum scan file, check apakah claim_id=X mungkin ada — skip file jika tidak. 90% I/O saved.",
tools:["Apache Parquet (bloom)","Apache Kafka","Cassandra","Redis","PostgreSQL"],sim:"bloom"},
{id:42,cat:"Performa",color:"#a855f7",term:"Statistics & Cost-Based Optimizer",icon:"M18 20V10M12 20V4M6 20v-6",
konsep:"DB kumpulkan statistik distribusi data (row count, distinct values, histogram) untuk pilih query plan paling murah.",
met:"ANALYZE koleksi stats. CBO evaluate semua possible plans, estimasi cost (I/O + CPU), pilih minimum cost plan.",
proses:"ANALYZE → Collect stats (rows, distinct, histogram) → Query → CBO enumerate plans → Estimate costs → Choose min",
contoh:"PostgreSQL: ANALYZE setelah load data besar. Stale stats → bad query plan → bisa 100x lebih lambat.",
tools:["PostgreSQL ANALYZE","BigQuery (auto)","Snowflake (auto)","MySQL ANALYZE TABLE","Oracle DBMS_STATS"],sim:"cbo"},
// SECURITY
{id:43,cat:"Security",color:"#ef4444",term:"Data Masking & Anonymization",icon:"M17.94 17.94A10 10 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22",
konsep:"Static masking: replace PII sebelum copy ke non-prod. Dynamic masking: mask real-time saat query berdasarkan role.",
met:"Format-preserving masking: NIK 12 digit → 12 digit random (jaga referential integrity). Anonymization: irreversible.",
proses:"Identify PII cols → Define mask policy per role → Query → Policy evaluation → Return masked (analyst) or real (admin)",
contoh:"BigQuery Dynamic Masking: analyst lihat NIK → ••••••••. Admin lihat full NIK. Policy di level column.",
tools:["BigQuery Dynamic Masking","Google DLP","Delphix","Snowflake DDM","Informatica"],sim:"masking"},
{id:44,cat:"Security",color:"#dc2626",term:"RBAC & Column/Row-Level Security",icon:"M3 11l19-9-9 19-2-8-8-2z",
konsep:"RBAC: akses berdasarkan role. CLS: sembunyikan kolom sensitif. RLS: filter baris — user hanya lihat data miliknya.",
met:"CLS: policy tag di kolom, bind role. RLS: inject WHERE clause otomatis berdasarkan user identity.",
proses:"User Query → IAM Auth → Column filter (CLS) → Row filter (RLS: WHERE branch=user.branch) → Return filtered",
contoh:"Analyst hanya lihat data cabang sendiri (RLS), tidak bisa lihat kolom NIK (CLS). BigQuery IAM + Policy Tags.",
tools:["BigQuery IAM","Dataplex Policy Tags","Snowflake RLS","Apache Ranger"],sim:"rbac"},
{id:45,cat:"Security",color:"#b91c1c",term:"Encryption — At-Rest & In-Transit",icon:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
konsep:"At-rest: data di storage dienkripsi (AES-256). In-transit: data saat transfer dienkripsi (TLS 1.3). CMEK: customer-managed keys.",
met:"At-rest: DB/storage encrypt files. In-transit: TLS layer. CMEK: bawa key sendiri ke cloud provider (GCP KMS).",
proses:"Write data → Encrypt with key → Store ciphertext | Read → Decrypt with key → Plaintext | Key rotation periodic",
contoh:"BigQuery CMEK: kunci enkripsi tabel klaim AHM di Cloud KMS yang dikontrol Astra, bukan Google.",
tools:["GCP KMS","AWS KMS","BigQuery CMEK","TLS 1.3","HashiCorp Vault"],sim:"encryption"},
{id:46,cat:"Security",color:"#991b1b",term:"Audit Logging",icon:"M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z",
konsep:"Catat semua aktivitas akses data: siapa, apa, kapan, dari mana. Immutable audit trail untuk compliance dan forensics.",
met:"Intercept semua DB operations. Log: user, timestamp, query, rows_accessed, IP. Immutable. SIEM integration untuk alerting.",
proses:"User action → Intercept → Log event (who, what, when, where) → Immutable store → SIEM → Alert if anomaly",
contoh:"BigQuery Audit Logs: setiap query ke tabel klaim ter-log. Compliance OJK: buktikan siapa akses data kapan.",
tools:["BigQuery Audit Logs","Cloud Logging","AWS CloudTrail","Splunk","Elastic SIEM"],sim:"audit"},
{id:47,cat:"Security",color:"#7f1d1d",term:"Data Tokenization",icon:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
konsep:"Ganti data sensitif dengan token random yang tidak punya makna. Berbeda dari enkripsi: token tidak bisa di-reverse tanpa token vault.",
met:"Token vault maps real_value ↔ token. Hanya vault yang tahu mapping. Systems simpan token saja. PCI-DSS standard.",
proses:"Sensitive value → Tokenization service → Generate random token → Store mapping in vault → Return token to system",
contoh:"Nomor kartu kredit nasabah ACC disimpan sebagai token di semua systems. Hanya payment processor akses vault.",
tools:["Protegrity","Voltage Security","AWS Payment Cryptography","HashiCorp Vault"],sim:"tokenization"},

{id:48,cat:"Modern/ML",color:"#8b5cf6",term:"Feature Store",icon:"M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 8v4l3 3",

{id:49,cat:"Modern/ML",color:"#7c3aed",term:"Schema Registry",icon:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8",
konsep:"Central registry untuk schema event/message Kafka. Garantikan producer & consumer pakai schema compatible. Versioning.",

{id:50,cat:"Modern/ML",color:"#6d28d9",term:"Data Observability",icon:"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
konsep:"Monitor kesehatan data pipeline: freshness, volume, distribution, schema, lineage. Detect anomali sebelum user terasa.",
met:"5 pillars: Freshness (data up-to-date?), Volume (jumlah wajar?), Distribution (normal?), Schema (ada perubahan?), Lineage.",
proses:"Continuous monitoring → Detect anomaly (volume drop, freshness late, schema change) → Alert → Root cause via lineage",
contoh:"Monte Carlo detect: volume tabel klaim drop 90% jam 03.00 → alert sebelum laporan pagi rusak.",
tools:["Monte Carlo","Bigeye","Acceldata","dbt tests","Datafold"],sim:"observability"},
{id:51,cat:"Modern/ML",color:"#5b21b6",term:"Vector Database",icon:"M18 20V10M12 20V4M6 20v-6",
konsep:"DB untuk menyimpan dan mencari embedding vectors (representasi numerik teks/image). Query by similarity, bukan exact match.",
met:"ANN indexing: HNSW, IVF. Similarity: cosine, dot product, euclidean. Fast million-scale approximate nearest neighbor search.",
proses:"Text/Image → Embedding Model → Vector [0.2, 0.8, ...] → Store → Query vector → ANN search → Top-K similar",
contoh:"Astra Digital chatbot: pertanyaan user → embed → search VectorDB → temukan FAQ mirip → jawaban relevan.",
tools:["Pinecone","Weaviate","Qdrant","pgvector (PostgreSQL)","BigQuery Vector Search"],sim:"vectordb"},
{id:52,cat:"Modern/ML",color:"#4c1d95",term:"LLM + Data Pipeline",icon:"M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z",
konsep:"Integrasi LLM ke dalam data pipeline: extract structured dari unstructured (PDF, email), DQ check, auto-documentation.",
met:"LLM sebagai transformation step. Input: raw text/PDF. Output: structured JSON. Validate output, handle hallucination.",
proses:"Raw PDF/Text → LLM API (extract fields) → Validate JSON output → DQ check → Load to structured table",
contoh:"Pipeline klaim AHM: LLM extract diagnosis, obat, jumlah dari PDF dokter → JSON terstruktur → BigQuery.",
tools:["Vertex AI Gemini","OpenAI API","LangChain","Instructor","Pydantic"],sim:"llmpipeline"},
// DB FUNDAMENTALS
{id:53,cat:"DB Fundamentals",color:"#22d3ee",term:"ACID",icon:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
konsep:"Atomicity (all-or-nothing), Consistency (valid state), Isolation (concurrent aman), Durability (tidak hilang saat crash). Fondasi DB reliability.",
met:"Atomicity: rollback log. Consistency: constraints. Isolation: MVCC/locks. Durability: WAL flush sebelum ACK.",
proses:"BEGIN → Execute ops → Validate → COMMIT (WAL flush + ACK) | CRASH → Rollback via undo log",
contoh:"Transfer saldo: debit Andi + kredit Budi harus atomic. Jika kredit gagal → debit di-rollback otomatis.",
tools:["PostgreSQL","MySQL InnoDB","Oracle","BigQuery DML","Apache Iceberg"],sim:"acid"},
{id:54,cat:"DB Fundamentals",color:"#34d399",term:"BASE",icon:"M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2",
konsep:"Basically Available, Soft state, Eventually consistent. Kebalikan ACID. Prefer availability daripada strict consistency.",
met:"Write → ACK langsung, propagate async ke replicas. Data akan konsisten pada akhirnya setelah propagation.",
proses:"Write primary → ACK immediately → Async propagate to N replicas → Nodes converge → Eventually consistent",
contoh:"Cassandra notifikasi Astra: write super cepat, user mungkin lihat delay 1-2 detik sebelum semua replika sinkron.",
tools:["Cassandra","DynamoDB","MongoDB","CouchDB","Redis"],sim:"base"},
{id:55,cat:"DB Fundamentals",color:"#f472b6",term:"CAP Theorem",icon:"M12 2l10 18H2z",
konsep:"Distributed system hanya bisa pilih 2 dari 3: Consistency, Availability, Partition Tolerance.",
met:"P hampir wajib di distributed system. Pilihan nyata: CP (reject request saat partition) vs AP (serve stale data).",
proses:"Network partition → CP: block until consistent | AP: continue serving stale data",
contoh:"BigQuery/Spanner: CP (strong consistency). Cassandra/DynamoDB: AP (always available).",
tools:["Zookeeper (CP)","Cassandra (AP)","DynamoDB (tunable)","etcd (CP)","CouchDB (AP)"],sim:"cap"},
{id:56,cat:"DB Fundamentals",color:"#fb923c",term:"Write-Ahead Log (WAL)",icon:"M3 6h18M3 12h18M3 18h18",
konsep:"Setiap perubahan ditulis ke sequential log DULU sebelum ke storage utama. Dasar ACID durability, crash recovery, CDC.",
met:"Append-only sequential file (fast I/O). Crash → replay WAL dari last checkpoint → zero data loss.",
proses:"Write req → Append WAL (sequential, fast) → ACK to client → Apply to heap (async) → Checkpoint periodic",
contoh:"PostgreSQL WAL di-baca Debezium untuk CDC → BigQuery. Crash server → replay WAL, data kembali.",
tools:["PostgreSQL WAL","MySQL binlog","Oracle Redo Log","Debezium","GCP Datastream"],sim:"wal"},
{id:57,cat:"DB Fundamentals",color:"#a78bfa",term:"MVCC — Multi-Version Concurrency Control",icon:"M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z",
konsep:"Tiap write buat versi data baru — reader tidak block writer. Reader lihat snapshot konsisten tanpa lock. High concurrency.",
met:"Setiap row: xmin (created by), xmax (deleted/updated by). Reader lihat versi visible berdasarkan txn snapshot.",
proses:"Writer: INSERT new row version (old version retained) | Reader: see snapshot of visible versions → no blocking",
contoh:"PostgreSQL: 100 reader + 10 writer berjalan tanpa saling block. Reader lihat data sebelum UPDATE selesai.",
tools:["PostgreSQL","Oracle","MySQL InnoDB","CockroachDB","Snowflake"],sim:"mvcc"},
{id:58,cat:"DB Fundamentals",color:"#fbbf24",term:"Index — B-tree, Hash, Bitmap, GiST",icon:"M18 20V10M12 20V4M6 20v-6",
konsep:"Struktur data tambahan untuk mempercepat lookup. B-tree: O(log n) range. Hash: O(1) equality. Bitmap: low cardinality. GiST: geospatial.",
met:"B-tree: balanced tree, fast range. Hash: hash table, equality only. Bitmap: 1 bit per row, low cardinality. GiST: extensible.",
proses:"CREATE INDEX → Build structure | INSERT/UPDATE: maintain index | Query → Index lookup O(log n) → Fetch rows",
contoh:"B-tree index on claim_date → range query cepat. Bitmap index on status (5 values) → OR/AND bitwise filter.",
tools:["PostgreSQL","MySQL","BigQuery Clustering","MongoDB","Elasticsearch"],sim:"btree"},
{id:59,cat:"DB Fundamentals",color:"#4ade80",term:"Deadlock",icon:"M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM4.93 4.93l14.14 14.14",
konsep:"Dua transaksi saling menunggu lock satu sama lain — tidak ada yang bisa lanjut. DB detect dan kill salah satu (victim).",
met:"Deadlock detection: wait-for graph (cycle = deadlock). Prevention: acquire locks in consistent order. Timeout-based.",
proses:"Txn A locks Row1 → Txn B locks Row2 → A waits Row2 → B waits Row1 → Cycle → DB kills one → Rollback → Retry",
contoh:"Dua proses update order bersamaan dengan urutan tabel berbeda → deadlock → salah satu di-rollback, retry.",
tools:["PostgreSQL","MySQL","SQL Server","Oracle","CockroachDB"],sim:"deadlock"},
{id:60,cat:"DB Fundamentals",color:"#67e8f9",term:"Connection Pooling",icon:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
konsep:"Pool koneksi DB yang di-reuse antar requests. Membuka koneksi baru itu mahal (TCP + auth) — pool menghindari overhead.",
met:"Pool maintain N koneksi aktif. Request: ambil dari pool → pakai → kembalikan. Queue jika semua busy.",
proses:"App request → Get idle connection from pool → Execute query → Return connection to pool → Next req reuses",
contoh:"PgBouncer pool 20 koneksi ke PostgreSQL. 1000 concurrent API requests → masuk antrian, tidak buat 1000 koneksi baru.",
tools:["PgBouncer","HikariCP","SQLAlchemy Pool","pgpool-II","Supabase Pooler"],sim:"connpool"},
{id:61,cat:"DB Fundamentals",color:"#c084fc",term:"Sharding — Horizontal Partitioning",icon:"M21 5c0 1.66-4 3-9 3S3 6.66 3 5m18 0c0-1.66-4-3-9-3S3 3.34 3 5m18 0v14c0 1.66-4 3-9 3s-9-1.34-9-3V5",
konsep:"Pecah database secara horizontal ke multiple nodes (shards) berdasarkan shard key. Scale-out horizontal ketika satu server tidak cukup.",
met:"Shard key tentukan distribusi. Consistent hashing: avoid resharding. Cross-shard query mahal (scatter-gather).",
proses:"Write → Hash(shard_key) → Route to shard N → Execute local | Cross-shard: scatter all → gather → merge",
contoh:"User_id 0-1M di shard 1, 1M-2M di shard 2. Query selalu include user_id untuk single-shard routing.",
tools:["MongoDB","Cassandra","MySQL Vitess","CockroachDB","PostgreSQL Citus"],sim:"sharding"},
{id:62,cat:"DB Fundamentals",color:"#fb7185",term:"Replication — Sync vs Async",icon:"M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2",
konsep:"Copy data dari primary ke replica. Sync: tunggu semua replica ACK (strong consistency). Async: ACK langsung (eventual).",
met:"Sync: zero data loss, tapi latency = slowest replica. Async: low latency, tapi failover bisa kehilangan data.",
proses:"Write primary → Sync: wait all replicas ACK then return | Async: return immediately, replicate in background",
contoh:"PostgreSQL: 1 sync replica (DR guarantee), 1 async (read replica). MySQL: async replication default.",
tools:["PostgreSQL Streaming Rep","MySQL Group Replication","Galera Cluster","Cloud Spanner","Patroni"],sim:"replication"},
{id:63,cat:"DB Fundamentals",color:"#38bdf8",term:"Checkpoint",icon:"M20 6L9 17l-5-5",
konsep:"Flush semua dirty pages dari buffer pool ke disk periodik. Batasi seberapa jauh WAL harus di-replay saat crash recovery.",
met:"Checkpoint record LSN (Log Sequence Number). Crash: hanya replay WAL setelah last checkpoint. Lebih sering = faster recovery.",
proses:"Buffer accumulates dirty pages → Checkpoint trigger → Flush all dirty to disk → Record LSN → Truncate old WAL",
contoh:"PostgreSQL checkpoint_timeout=5min. Crash → hanya replay 5 menit WAL terakhir, bukan dari awal.",
tools:["PostgreSQL","MySQL InnoDB","Oracle","SQL Server","RocksDB"],sim:"checkpoint"},
{id:64,cat:"DB Fundamentals",color:"#86efac",term:"Two-Phase Commit (2PC)",icon:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4",
konsep:"Protokol distributed transaction: semua participant commit atau semua rollback secara atomik. Coordinator mengkoordinasi.",
met:"Phase 1 (Prepare): tanya semua 'ready?'. Phase 2 (Commit/Abort): semua ready → commit all, ada NO → abort all.",
proses:"Coordinator: PREPARE → Each participant: vote YES/NO → All YES: COMMIT all | Any NO: ABORT all",
contoh:"Transfer lintas DB AHM dan ACC: 2PC garantikan debit AHM + kredit ACC commit atomik atau keduanya rollback.",
tools:["PostgreSQL XA","MySQL XA","JTA","Google Spanner","Saga Pattern (alt)"],sim:"twopc"},
{id:65,cat:"DB Fundamentals",color:"#fcd34d",term:"Normalization 1NF–3NF–BCNF",icon:"M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z",
konsep:"Eliminasi redundansi. 1NF: atomic values, unique rows. 2NF: no partial dependency. 3NF: no transitive dependency. BCNF: stricter.",
met:"1NF: no repeating groups, atomic. 2NF: non-key attrs fully depend on entire PK. 3NF: no non-key → non-key dependency.",
proses:"Unnormalized → 1NF (atomic) → 2NF (remove partial deps) → 3NF (remove transitive deps) → BCNF",
contoh:"MySQL klaim AHM: normalized 3NF (no redundancy). BigQuery DWH mart: sengaja denormalized Star Schema.",
tools:["MySQL","PostgreSQL","Oracle","SQL Server","ERwin"],sim:"normalization"},
{id:66,cat:"DB Fundamentals",color:"#a3e635",term:"Primary Key & Composite Key",icon:"M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4",
konsep:"Primary Key: unik identifikasi tiap row, NOT NULL. Composite Key: PK dari 2+ kolom (kombinasi unik). Max 1 PK per tabel.",
met:"PK: DB creates unique index automatically. Composite PK: untuk junction tables (many-to-many). FK references all PK columns.",
proses:"Define PK/Composite → DB creates unique index → INSERT: validate uniqueness → FK: validate all PK columns",
contoh:"pasien(patient_id PK). link_klaim_dokter(claim_id, doctor_id: Composite PK). order_item(order_id, item_id: Composite PK).",
tools:["MySQL","PostgreSQL","Oracle","BigQuery","SQLite"],sim:"primarykey"},
{id:67,cat:"DB Fundamentals",color:"#f0abfc",term:"Foreign Key & Referential Integrity",icon:"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71",
konsep:"FK garantikan nilai di child table SELALU ada di parent table. Mencegah orphan records. ON DELETE CASCADE/RESTRICT/SET NULL.",
met:"DB enforce referential integrity pada INSERT/UPDATE/DELETE. CASCADE: delete child saat parent. RESTRICT: tolak hapus parent.",
proses:"INSERT child (FK val) → DB checks parent table → PK exists: ALLOW | Not exists: ERROR FK violation",
contoh:"fact_klaim.pasien_sk FK ke dim_pasien.patient_sk. Insert klaim tanpa pasien valid → FK constraint error.",
tools:["PostgreSQL","MySQL","Oracle","SQL Server","SQLite"],sim:"foreignkey"},
{id:68,cat:"DB Fundamentals",color:"#93c5fd",term:"Unique Constraint & Check Constraint",icon:"M20 6L9 17l-5-5",
konsep:"UNIQUE: tidak ada duplikat nilai di kolom/kombinasi. CHECK: validasi nilai harus memenuhi kondisi (range, enum).",
met:"UNIQUE: DB buat index hidden di baliknya. CHECK: evaluated on INSERT/UPDATE. Combinable multiple constraints.",
proses:"INSERT/UPDATE → Check UNIQUE (index lookup) → Check CHECK constraint → Both pass: ALLOW | Any fail: ERROR",
contoh:"NIK UNIQUE (tidak boleh duplikat). jumlah_klaim CHECK (> 0). status CHECK IN ('pending','approved','rejected').",
tools:["PostgreSQL","MySQL","Oracle","BigQuery","SQLite"],sim:"unique"},
{id:69,cat:"DB Fundamentals",color:"#6ee7b7",term:"Cardinality",icon:"M18 20V10M12 20V4M6 20v-6",
konsep:"Jumlah unique values di kolom. High card (ID: jutaan unique) vs Low card (status: 5 unique). Menentukan index & partition strategy.",
met:"High card: B-tree index, cluster key. Low card: bitmap index, partition column. Penting untuk query optimizer estimation.",
proses:"Analyze column → COUNT(DISTINCT col) → High: use B-tree/clustering | Low: bitmap index or partition column",
contoh:"BigQuery CLUSTER BY kode_cabang (50 values, low) lebih efektif dari CLUSTER BY claim_id (high cardinality).",
tools:["BigQuery","Snowflake","PostgreSQL","DuckDB","Apache Spark"],sim:"cardinality"},
{id:70,cat:"DB Fundamentals",color:"#fca5a5",term:"Surrogate Key vs Natural Key",icon:"M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5",
konsep:"Natural Key: ID dari bisnis (NIK) — meaningful tapi bisa berubah. Surrogate: ID buatan sistem (UUID/BIGINT) — stable, meaningless.",
met:"DWH best practice: surrogate key di dimension tables. Natural key tetap disimpan untuk business lookup & CDC dedup.",
proses:"Source Natural Key (NIK) → Lookup in dim → exists: return SK | not exists: generate new SK → store both",
contoh:"dim_pasien: patient_sk BIGINT (surrogate) + nik VARCHAR (natural). fact JOIN via SK, lookup via NIK.",
tools:["dbt","BigQuery","Snowflake","Data Vault Hub","PostgreSQL SEQUENCE"],sim:"surrogatekey"},
{id:71,cat:"DB Fundamentals",color:"#d8b4fe",term:"NULL Handling",icon:"M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 8v4M12 16h.01",
konsep:"NULL = unknown/missing, bukan 0 atau empty string. NULL != NULL. Aggregate functions ignore NULL. Source of many bugs.",
met:"NULL propagation: 1 + NULL = NULL. COUNT(*) hitung semua, COUNT(col) skip NULL. COALESCE(val, default). IS NULL.",
proses:"NULL in column → Aggregation ignores it → Comparison: NULL != NULL → Use IS NULL / COALESCE → Handle in query",
contoh:"SUM(jumlah_klaim) ignore NULL rows. COUNT(diagnosis) skip rows tanpa diagnosis. COALESCE(phone, 'N/A') untuk display.",
tools:["PostgreSQL","MySQL","BigQuery","Snowflake","DuckDB"],sim:"null"},
{id:72,cat:"DB Fundamentals",color:"#fdba74",term:"Transaction & Savepoint",icon:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",
konsep:"Transaction: unit atomik dari operasi DB. Savepoint: checkpoint di dalam transaction — bisa rollback ke titik tertentu.",
met:"BEGIN → ops → SAVEPOINT sp1 → more ops → ROLLBACK TO sp1 (undo only after sp1) → COMMIT.",
proses:"BEGIN → Op1 → SAVEPOINT sp1 → Op2 fails → ROLLBACK TO sp1 (Op2 undone, Op1 retained) → COMMIT",
contoh:"Insert batch 1000 klaim: SAVEPOINT tiap 100. Jika batch ke-7 gagal → rollback ke savepoint-6, retry hanya batch ke-7.",
tools:["PostgreSQL","MySQL","Oracle","SQL Server","SQLite"],sim:"savepoint"},
{id:73,cat:"DB Fundamentals",color:"#6ee7b7",term:"Lock Types — Shared, Exclusive, Row, Table",icon:"M3 11l19-9-9 19-2-8-8-2z",
konsep:"Shared lock (S): multiple reader ok, no writer. Exclusive lock (X): only this txn reads and writes. Row: fine-grained. Table: coarse.",
met:"S + S = compatible. S + X = incompatible (wait). X + X = incompatible. Row lock preferred. Table lock saat DDL.",
proses:"Txn requests lock → Lock manager checks compatibility → Compatible: grant | Incompatible: wait → Timeout/Deadlock",
contoh:"SELECT FOR UPDATE: exclusive row lock. Normal SELECT: shared lock. ALTER TABLE: table lock (blocks all).",
tools:["PostgreSQL","MySQL","Oracle","SQL Server","MariaDB"],sim:"locks"},
{id:74,cat:"DB Fundamentals",color:"#fbbf24",term:"VACUUM & AUTOVACUUM",icon:"M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
konsep:"VACUUM bersihkan dead tuples (sisa MVCC) di PostgreSQL. Tanpa VACUUM → table bloat → query lambat. AUTOVACUUM = otomatis.",
met:"UPDATE/DELETE di PG tidak hapus row langsung (MVCC). Dead tuples menumpuk. VACUUM reclaim. VACUUM FULL compact (lock).",
proses:"UPDATE/DELETE → Row marked dead (xmax set) → VACUUM → Find dead tuples → Mark free space → ANALYZE → Update stats",
contoh:"Tabel klaim AHM: banyak UPDATE status → dead tuples → autovacuum trigger → reclaim space → query cepat kembali.",
tools:["PostgreSQL VACUUM","pg_stat_user_tables","pganalyze","Supabase","RDS PostgreSQL"],sim:"vacuum"},
{id:75,cat:"DB Fundamentals",color:"#e879f9",term:"Table Bloat",icon:"M2 2h20v8H2zM2 14h20v8H2z",
konsep:"Tabel jauh lebih besar dari actual data karena dead tuples (MVCC) atau fragmented free space yang tidak bisa di-reuse efisien.",
met:"Monitor bloat: pg_bloat_check. Dead tuples > threshold → VACUUM. Index bloat → REINDEX. VACUUM FULL reclaim tapi lock.",
proses:"Many UPDATE/DELETE → Dead tuples accumulate → Table size grows → Query slower (more pages) → VACUUM reclaims",
contoh:"Tabel klaim setelah 1 juta UPDATE status → bloat 3x dari actual size → VACUUM ANALYZE → kembali normal.",
tools:["pgstattuple","pg_bloat_check","pganalyze","VACUUM FULL","REINDEX CONCURRENTLY"],sim:"bloat"},
{id:76,cat:"DB Fundamentals",color:"#818cf8",term:"Sequence & Auto-increment",icon:"M3 6h18M3 12h18M3 18h18",
konsep:"Sequence: object DB yang generate nilai integer unik berurutan. Gap mungkin terjadi (rollback, crash). Thread-safe.",
met:"Sequence pre-allocate batch values dari shared counter. AUTOINCREMENT MySQL, SERIAL/BIGSERIAL PostgreSQL, IDENTITY SQL Server.",
proses:"INSERT row → DB calls NEXTVAL(sequence) → Returns next unique integer → Assign to id column → Sequence advances",
contoh:"patient_id BIGSERIAL di PostgreSQL: insert pasien baru → auto generate 1,2,3... Gap ok, uniqueness guaranteed.",
tools:["PostgreSQL SERIAL/BIGSERIAL","MySQL AUTO_INCREMENT","Oracle SEQUENCE","SQL Server IDENTITY","UUID alt"],sim:"sequence"},
{id:77,cat:"DB Fundamentals",color:"#f9a8d4",term:"UUID vs BIGSERIAL — ID Strategy",icon:"M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5",
konsep:"UUID (128-bit, globally unique): no coordination needed, good distributed. BIGSERIAL (64-bit sequential): compact, fast index.",
met:"UUID v4: random (bad B-tree ordering). UUID v7: time-ordered (better). BIGSERIAL: sequential, great B-tree, requires coordination.",
proses:"UUID: generate random 128-bit → globally unique, no coordination | BIGSERIAL: NEXTVAL sequence → sequential, local DB",
contoh:"Microservice Astra Digital: UUID v7 sebagai event_id (distributed). PostgreSQL monolith: BIGSERIAL patient_id.",
tools:["PostgreSQL BIGSERIAL","UUID v4 (gen_random_uuid)","UUID v7","ULID","NanoID"],sim:"uuid"},
{id:78,cat:"DB Fundamentals",color:"#fde68a",term:"View vs Materialized View",icon:"M2 3h20v14H2zM8 21h8M12 17v4",
konsep:"View: virtual table, query dijalankan tiap kali (no storage, always fresh). MV: hasil disimpan fisik (fast tapi mungkin stale).",
met:"View: always fresh, no performance gain. MV: fast tapi perlu refresh. Use MV untuk expensive queries yang sering dipakai.",
proses:"View: query → execute underlying SQL → return fresh | MV: query → return stored result (fast, may be stale)",
contoh:"View laporan klaim: always fresh tapi 10 detik. MV agregasi harian: instant (pre-computed), refresh tiap jam.",
tools:["PostgreSQL MV","BigQuery MV","Snowflake Dynamic Tables","Oracle MV","MySQL (no native MV)"],sim:"viewmv"},
{id:79,cat:"DB Fundamentals",color:"#86efac",term:"Trigger",icon:"M22 12h-4l-3 9L9 3l-3 9H2",
konsep:"Prosedur otomatis dijalankan saat event DB terjadi (INSERT/UPDATE/DELETE). BEFORE atau AFTER event, per-row atau per-statement.",
met:"Register trigger function ke table + event + timing. Untuk audit logging, auto-populate derived columns, enforce business rules.",
proses:"INSERT/UPDATE/DELETE on table → DB fires trigger → Execute trigger function → Can modify NEW/OLD row → Continue",
contoh:"Trigger AFTER UPDATE status_klaim → INSERT audit_log(claim_id, old_status, new_status, changed_by, changed_at).",
tools:["PostgreSQL","MySQL","Oracle","SQL Server","SQLite"],sim:"trigger"},
{id:80,cat:"DB Fundamentals",color:"#67e8f9",term:"Stored Procedure & Function",icon:"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",
konsep:"Stored Procedure: blok SQL precompiled, execute dengan CALL. Function: returns value, bisa di SELECT. Logic di DB layer.",
met:"Pros: less network round-trips, pre-compiled. Cons: hard to version, logic di DB sulit di-test, tight coupling.",
proses:"CALL proc(params) → Load compiled plan → Execute body (multiple SQL) → Return result set",
contoh:"proc_process_klaim(claim_id): validate → update status → insert audit → notify. Satu call, 4 operations.",
tools:["PostgreSQL (PL/pgSQL)","MySQL","Oracle (PL/SQL)","SQL Server (T-SQL)","Snowflake"],sim:"storedproc"},
{id:81,cat:"DB Fundamentals",color:"#c4b5fd",term:"CTE — Common Table Expression",icon:"M4 6h16M4 12h16M4 18h7",
konsep:"Named temporary result set yang bisa dipakai dalam query yang sama. Membuat query kompleks lebih readable. Recursive CTE untuk hierarchy.",
met:"WITH clause mendefinisikan CTE. Dibaca sekali, bisa direferensikan multiple times. Recursive: anchor + recursive member.",
proses:"WITH cte AS (SELECT ...) → Use cte in main query | Recursive: anchor UNION ALL recursive_member until no rows",
contoh:"WITH monthly AS (SELECT month, SUM(amount) FROM klaim GROUP BY month) SELECT * FROM monthly WHERE amount > 1M.",
tools:["PostgreSQL","BigQuery","Snowflake","MySQL 8+","SQL Server"],sim:"cte"},
{id:82,cat:"DB Fundamentals",color:"#a5f3fc",term:"Window Function",icon:"M3 3h18v18H3z",

{id:87,cat:"Consistency",color:"#c084fc",term:"Eventual Consistency",icon:"M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2",

// ═══════════════════════════════════════════
// SVG SIMULATION ENGINE
// ═══════════════════════════════════════════
const FT={};// flow timers
const ST={};// sim timers

function sn(tag,a,p){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);if(a)Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(p)p.appendChild(e);return e}
function bx(p,x,y,w,h,c,l,s){
  const g=sn("g",{},p);
  sn("rect",{x,y,width:w,height:h,rx:5,fill:c+"18",stroke:c+"55","stroke-width":"1.2"},g);
  sn("text",{x:x+w/2,y:y+h/2-(s?4:0),fill:c+"cc","font-size":"8","text-anchor":"middle","font-family":"monospace","font-weight":"600"},g).textContent=l;
  if(s)sn("text",{x:x+w/2,y:y+h/2+8,fill:c+"66","font-size":"6.5","text-anchor":"middle","font-family":"monospace"},g).textContent=s;
  return g;
}
function tx(p,t,x,y,c,sz,opts={}){
  const e=sn("text",{x,y,fill:c,"font-size":sz,"text-anchor":opts.a||"middle","font-family":"monospace","font-weight":opts.w||"400"},p);
  e.textContent=t;return e;
}
function pk(s,x,y,c,r=5){const e=sn("circle",{cx:x,cy:y,r,fill:c,opacity:.9},s);return e}
function ln(p,x1,y1,x2,y2,c,dash=false){return sn("line",{x1,y1,x2,y2,stroke:c+"55","stroke-width":"1.3",...(dash?{"stroke-dasharray":"5,3"}:{})},p)}
function glow(e,c){e.style.filter=`drop-shadow(0 0 4px ${c})`}

function cleanup(id){if(ST[id]){ST[id].forEach(t=>clearInterval(t));delete ST[id]}}
function addTimer(id,t){if(!ST[id])ST[id]=[];ST[id].push(t)}

function makeSVG(wrap){
  const W=wrap.offsetWidth||600,H=120;
  const s=sn("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`},wrap);
  return {s,W,H};
}

// ── MEDALLION ──
function simMedallion(wrap,c,id){
  const{s,W}=makeSVG(wrap);
  const cols=["#cd7f32","#94a3b8","#fbbf24"];
  const lbs=["🥉 Bronze","🥈 Silver","🥇 Gold"];
  const sbs=["Raw as-is","Clean+Valid","Mart/Agg"];
  const bw=(W-40)/3;
  const rects=[];
  lbs.forEach((l,i)=>{
    const x=10+i*(bw+5);
    const g=bx(s,x,18,bw,70,cols[i],l,sbs[i]);
    rects.push(g.querySelector("rect"));
    if(i<2)ln(s,x+bw,52,x+bw+5,52,cols[i]);
  });
  const statusL=tx(s,"",W/2,108,c+"77",7.5);
  const msgs=[
    ["Bronze: raw data arrives → unvalidated, may have nulls",0],
    ["Bronze → Silver: cleaning, dedup, validation applied",1],
    ["Silver → Gold: aggregation, joins, ready for BI/ML",2],
    ["Gold layer served to dashboard & ML models ✓",2],
  ];
  let phase=0;
  const t=setInterval(()=>{
    const [msg,hi]=msgs[phase%msgs.length];
    statusL.textContent=msg;
    rects.forEach((r,i)=>gsap.to(r,{attr:{fill:i<=hi?cols[i]+"44":cols[i]+"0a"},duration:.4}));
    if(phase%msgs.length>0){
      const pi=(phase%msgs.length)-1;
      const px=10+pi*(bw+5)+bw;
      const p=pk(s,px,52,cols[pi]);glow(p,cols[pi]);
      gsap.to(p,{attr:{cx:px+5+bw/2},duration:.5,onComplete:()=>p.remove()});
    }
    phase++;
  },1100);
  addTimer(id,t);
}

// ── ACID ──
function simAcid(wrap,c,id){
  const{s,W}=makeSVG(wrap);
  const rows=[{l:"Account A",v:1000},{l:"Account B",v:500}];
  const rR=[],vT=[];
  rows.forEach((r,i)=>{
    const rect=sn("rect",{x:8,y:10+i*28,width:160,height:22,rx:4,fill:c+"0e",stroke:c+"30","stroke-width":"1"},s);
    tx(s,r.l,55,22+i*28,c+"88",8);
    const v=tx(s,`${r.v}`,140,22+i*28,c+"cc",8,{w:"700"});
    rR.push(rect);vT.push(v);
  });
  bx(s,W-170,8,155,50,c,"Transaction","");
  const txL=tx(s,"BEGIN",W-93,30,c+"cc",8,{w:"700"});
  const stL=tx(s,"",W-93,46,c+"66",7);
  const walL=tx(s,"📝 WAL: ",10,75,c+"66",7,{a:"start"});
  walL.setAttribute("opacity","0");
  let phase=0,vals=[1000,500];
  const flow=[
    ()=>{txL.textContent="BEGIN TXN";stL.textContent="";walL.setAttribute("opacity","0");
      rows.forEach((_,i)=>{vT[i].textContent=vals[i];gsap.to(rR[i],{attr:{fill:c+"0e"},duration:.3})});},
    ()=>{txL.textContent="DEBIT A -300";gsap.to(rR[0],{attr:{fill:c+"33",stroke:c},duration:.3});vT[0].textContent="700";walL.setAttribute("opacity","1");walL.textContent="📝 WAL: A=700";stL.textContent="writing...";},
    ()=>{txL.textContent="CREDIT B +300";gsap.to(rR[1],{attr:{fill:c+"33",stroke:c},duration:.3});vT[1].textContent="800";walL.textContent="📝 WAL: A=700,B=800";},
    ()=>{txL.textContent="COMMIT ✓";txL.setAttribute("fill","#22c55e");stL.textContent="durable!";stL.setAttribute("fill","#22c55e");
      rR.forEach(r=>gsap.to(r,{attr:{fill:"#22c55e22",stroke:"#22c55e55"},duration:.4}));},
    ()=>{txL.setAttribute("fill",c+"cc");rows.forEach((_,i)=>{vT[i].textContent=vals[i];gsap.to(rR[i],{attr:{fill:c+"0e",stroke:c+"30"},duration:.3})});txL.textContent="BEGIN again";stL.textContent="";walL.textContent="📝 WAL: ";},
    ()=>{txL.textContent="DEBIT A -300";gsap.to(rR[0],{attr:{fill:c+"33",stroke:c},duration:.3});vT[0].textContent="700";walL.setAttribute("opacity","1");},
    ()=>{txL.textContent="💥 CRASH!";txL.setAttribute("fill","#ef4444");stL.textContent="power failure";stL.setAttribute("fill","#ef4444");
      rR.forEach(r=>gsap.to(r,{attr:{fill:"#ef444422",stroke:"#ef444455"},duration:.3}));},
    ()=>{txL.textContent="🔄 ROLLBACK";txL.setAttribute("fill","#fbbf24");stL.textContent="replaying WAL";stL.setAttribute("fill","#fbbf24");
      rows.forEach((_,i)=>{vT[i].textContent=vals[i]});rR.forEach(r=>gsap.to(r,{attr:{fill:c+"0e",stroke:c+"30"},duration:.5}));},
    ()=>{txL.textContent="✅ Restored!";txL.setAttribute("fill","#22c55e");stL.textContent="no data lost";stL.setAttribute("fill","#22c55e");phase=-1;},
  ];
  const t=setInterval(()=>{flow[(phase+flow.length)%flow.length]();phase++;},950);
  addTimer(id,t);
}

// ── CAP ──
function simCap(wrap,c,id){
  const{s,W}=makeSVG(wrap);
  const nodes=[{x:W/2,y:18,c:"#6366f1",l:"Node A"},{x:55,y:92,c:"#22d3ee",l:"Node B"},{x:W-55,y:92,c:"#a855f7",l:"Node C"}];
  const circs=[],vers=[];
  nodes.forEach((n)=>{
    const ci=sn("circle",{cx:n.x,cy:n.y,r:18,fill:n.c+"22",stroke:n.c,"stroke-width":"1.5"},s);
    glow(ci,n.c);
    tx(s,n.l,n.x,n.y+30,n.c+"88",6.5);
    const v=tx(s,"v=1",n.x,n.y+5,n.c+"cc",7.5,{w:"700"});
    circs.push(ci);vers.push(v);
  });
  const lines=[
    sn("line",{x1:nodes[0].x,y1:nodes[0].y+18,x2:nodes[1].x,y2:nodes[1].y-18,stroke:"#22c55e66","stroke-width":"1.5"},s),
    sn("line",{x1:nodes[0].x,y1:nodes[0].y+18,x2:nodes[2].x,y2:nodes[2].y-18,stroke:"#22c55e66","stroke-width":"1.5"},s),
    sn("line",{x1:nodes[1].x+18,y1:nodes[1].y,x2:nodes[2].x-18,y2:nodes[2].y,stroke:"#22c55e66","stroke-width":"1.5"},s),
  ];
  const stL=tx(s,"All nodes consistent ✓",W/2,114,"#22c55e",7.5);
